<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orcy Quiz Mock - Gacha Pause Move</title>

  <style>
  :root{
    --W:390; --H:844;
    --ink:#111; --accent:#1f5bd6; --line:#1b2a57;
    --gold:#ffcc33;
  }
  html,body{margin:0;height:100%;background:#000;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;}
  #stage{
    width:100vw;height:100vh;display:grid;place-items:start;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:#000;
  }
  #app{
    width:calc(var(--W)*1px);height:calc(var(--H)*1px);
    background:#fff;position:relative;overflow:hidden;
    transform-origin:top left;touch-action:manipulation;
  }

  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;
    padding:40px 24px 28px;gap:18px;
  }
  .hidden{display:none}

  /* START */
  .start{
    justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#6fe6ff 0%,#1f5bd6 45%,#062033 100%);
    color:#fff;text-align:center;
    user-select:none;-webkit-tap-highlight-color: transparent;
  }
  .start-title{font-size:58px;font-weight:900;line-height:1.05}
  .start-sub{font-size:26px;font-weight:800;margin-top:12px}
  .tap{
    margin-top:28px;padding:10px 24px;border-radius:999px;border:2px solid #fff;
    font-weight:900;letter-spacing:.06em;
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}

  /* COMMON */
  .title{margin-top:60px;font-size:56px;font-weight:800;color:var(--ink)}
  .orc{width:220px;height:220px;display:grid;place-items:center;user-select:none}
  .orc img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
  .question{font-size:24px;font-weight:800;text-align:center;color:var(--ink);line-height:1.25;white-space:pre-line}
  .choices{width:100%;display:flex;flex-direction:column;gap:10px}
  .btn{
    height:62px;border-radius:14px;border:3px solid var(--line);
    background:#fff;color:var(--accent);font-size:22px;font-weight:900;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{transform:scale(.97);filter:brightness(.97)}
  .primary{
    position:absolute;left:24px;right:24px;bottom:36px;
    height:70px;border-radius:18px;border:none;
    background:var(--accent);color:#fff;font-size:26px;font-weight:1000;
  }
  .primary:active{transform:scale(.99);filter:brightness(.95)}

  /* TOP HUD */
  .hud{
    position:absolute;top:18px;left:18px;right:18px;
    display:flex;align-items:center;justify-content:space-between;
    pointer-events:none;
  }
  .pill{
    padding:10px 12px;border-radius:999px;
    background:rgba(255,255,255,.92);
    border:2px solid rgba(0,0,0,.10);
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    font-weight:1000;
    color:rgba(0,0,0,.78);
    display:flex;gap:8px;align-items:center;
  }
  .dot{
    width:10px;height:10px;border-radius:999px;background:var(--gold);
    box-shadow:0 0 0 4px rgba(255,204,51,.25);
  }
  .small{font-size:13px;font-weight:900;color:rgba(0,0,0,.55);}

  /* PAUSE（ぽこぽこ） */
  .pause{
    background:radial-gradient(110% 90% at 50% 0%,#1b5a7a 0%,#062033 55%,#02101b 100%);
    color:#fff;
    justify-content:center;
  }
  .hint{
    position:absolute;right:24px;bottom:220px;
    font-size:26px;font-weight:1000;opacity:.9;
    writing-mode:vertical-rl;text-orientation:mixed;
    letter-spacing:.08em;
    color:rgba(255,255,255,.92);
  }

  /* GACHA（画像だけ・中央寄せ） */
  #s-gacha{
    justify-content:center;
    gap:0;
  }
  #s-gacha .orc{
    width:260px;
    height:260px;
  }

  /* Ticket-ish block */
  .ticket{
    width:100%;
    margin-top:10px;
    padding:14px 14px 12px;
    border-radius:18px;
    border:3px solid rgba(0,0,0,.12);
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.86));
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
  }
  .ticket-left{
    width:160px;height:160px;
    border-radius:14px;
    border:2px solid rgba(0,0,0,.15);
    background:#fff;
    display:grid;place-items:center;
    overflow:hidden;
  }
  #qr{width:140px;height:140px}
  .ticket-right{
    flex:1;
    display:flex;flex-direction:column;gap:6px;
    text-align:left;
  }
  .ticket-badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,204,51,.28);
    border:2px solid rgba(255,204,51,.55);
    color:#7a5200;
    font-weight:1000;
    width:max-content;
  }
  .ticket-text{
    font-weight:1000;
    color:#111;
    line-height:1.2;
    white-space:pre-line;
  }
  .ticket-sub{
    font-weight:900;
    color:rgba(0,0,0,.55);
    font-size:14px;
  }

  /* Stamp screen */
  .stamp-screen{
    justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#f6fbff 45%,#eef5ff 100%);
    text-align:center;
  }
  .stamp-screen .title{ margin-top:0; }

  /* END */
  .end{
    justify-content:center;
    background:#fff;
    text-align:center;
  }
  .end .title{ margin-top:0; }
  .score{
    margin-top:18px;
    font-size:24px;
    font-weight:900;
    color:var(--ink);
    line-height:1.3;
    white-space:pre-line;
  }

  /* QR screen */
  .qr-screen{
    justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#f1f7ff 40%,#e9f0ff 100%);
    text-align:center;
  }
  .qr-screen .title{ margin-top:0; }
  .tapback{
    margin-top:18px;
    padding:10px 18px;
    border-radius:999px;
    border:2px solid rgba(0,0,0,.2);
    font-weight:1000;
    color:rgba(0,0,0,.7);
  }

  /* PC */
  @media(min-width:820px){
    #stage{place-items:center}
    #app{border-radius:24px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
  }

  /* ===== Mobile fit pack（縦が足りない時に詰める） ===== */
  @media (max-width: 600px) {
    .screen{
      padding: 22px 18px 18px;
      gap: 12px;
    }
    .title{
      margin-top: 26px;
      font-size: 44px;
    }
    .orc{
      width: 190px;
      height: 190px;
    }
    .question{
      font-size: 20px;
    }
    .btn{
      height: 54px;
      font-size: 20px;
    }
    .primary{
      height: 60px;
      font-size: 22px;
      bottom: 18px;
    }
    .hud{
      top: 10px;
      left: 10px;
      right: 10px;
    }
    .pill{
      padding: 8px 10px;
    }

    /* ガチャも中央で少し大きめを維持 */
    #s-gacha .orc{
      width:240px;
      height:240px;
    }
  }

  /* どうしても縦が足りない端末だけスクロール許可（保険） */
  @media (max-width: 600px) and (max-height: 720px) {
    #s-q, #s-prize, #s-stamp, #s-qr {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  }
  </style>
</head>

<body>
<div id="stage"><div id="app">

  <!-- START -->
  <div id="s-start" class="screen start">
    <div class="start-title">オルシー<br>クイズ！</div>
    <div class="start-sub">画面をタップ</div>
    <div class="tap">START</div>
    <div style="margin-top:10px;opacity:.9;font-weight:900;">🔊 サウンドONであそんでね</div>
  </div>

  <!-- STAMP STATUS -->
  <div id="s-stamp" class="screen stamp-screen hidden">
    <div class="title">スタンプカード</div>

    <div class="ticket">
      <div class="ticket-right" style="flex:1;text-align:center;">
        <div class="ticket-badge" style="margin:0 auto;">いまのスタンプ</div>
        <div id="stamp-status" class="ticket-text" style="text-align:center;font-size:28px;">
          スタンプ 0/10
        </div>
        <div id="stamp-sub" class="ticket-sub" style="text-align:center;">
          あと0こでチケット！
        </div>
      </div>
    </div>

    <button id="stamp-next" class="primary">つぎ！</button>
  </div>

  <!-- QUESTION -->
  <div id="s-q" class="screen hidden">
    <div class="hud">
      <div class="pill"><span class="dot"></span><span id="hud-stamps">スタンプ 0/10</span></div>
      <div class="pill"><span class="small" id="hud-progress">1/10</span></div>
    </div>

    <div class="title">第1問</div>
    <div class="orc">
      <img id="q-image" src="" alt="問題画像">
    </div>
    <div class="question">（問題文）</div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- PAUSE -->
  <div id="s-pause" class="screen pause hidden">
    <div class="orc"><img src="orc_sink.png" alt="沈むオルシー"></div>
    <div class="hint">なにが出る…？</div>
  </div>

  <!-- ANSWER -->
  <div id="s-ans" class="screen hidden">
    <div id="ans-title" class="title">正解！</div>
    <div class="orc"><img id="ans-img" src="" alt="結果オルシー"></div>
    <div id="ans-msg" class="question"></div>
  </div>

  <!-- GACHA WAIT（画像だけ） -->
  <div id="s-gacha" class="screen hidden" style="background:radial-gradient(110% 90% at 50% 0%,#6fe6ff 0%,#1f5bd6 48%,#062033 100%);color:#fff;">
    <div class="orc"><img src="gacha.png" alt="ガチャ"></div>
  </div>

  <!-- PRIZE -->
  <div id="s-prize" class="screen hidden">
    <div id="prize-title" class="title"></div>
    <div class="orc"><img id="prize-img" src="" alt="景品"></div>
    <div id="prize-msg" class="question"></div>
    <button id="next" class="primary">つぎ！</button>
  </div>

  <!-- END -->
  <div id="s-end" class="screen end hidden">
    <div class="title">バイバーイ！</div>
    <div id="score" class="score">正解数：0（0問中）</div>
  </div>

  <!-- QR SCREEN -->
  <div id="s-qr" class="screen qr-screen hidden">
    <div class="title">チケット！</div>
    <div class="ticket">
      <div class="ticket-left">
        <canvas id="qr" width="140" height="140"></canvas>
      </div>
      <div class="ticket-right">
        <div class="ticket-badge">交換チケット</div>
        <div class="ticket-text" id="qr-msg">スタンプが10こ たまった！\nQRを見せてね！</div>
        <div class="ticket-sub" id="qr-sub">※いまはダミーQR（後で差し替えOK）</div>
      </div>
    </div>
    <div class="tapback">画面タップでつづきへ</div>
  </div>

</div></div>

<script>
(() => {
  // ====== 仕様（ゲーム進行レバー） ======
  const QUESTIONS_PER_PLAY = 10;
  const STAMPS_FOR_QR = 10;
  const FIRST_BONUS_STAMPS = 3;
  const CONSUME_STAMPS_ON_QR = true;

  // テスト/本番で差し替え（ダミー）
  const QR_PAYLOAD = "DUMMY-TICKET-ORCY-2026";

  // ====== 演出プリセット（ケレン味） ======
  const FX_PRESET_KEY = "sticky"; // "snappy" | "standard" | "sticky"

  const FX_PRESETS = {
    snappy: {
      LOCK: { START_MS:200, STAMP_NEXT_MS:160, QR_TAP_MS:160, END_TAP_MS:200, ANSWER_PICK_MS:160, NEXT_BTN_MS:160 },
      HOLD: { CORRECT_MS:520, WRONG_MS:780 },
      GACHA: {
        BASE_MS:650,
        RANDOM_JITTER_MS:160,
        PAUSE_RATIO:0.50,
        PAUSE_MIN_MS:180,
        PAUSE_MS:520
      },
      RATE: { BIG:0.5, NEAR_MISS:0.55 }, // ※テスト用でBIGを0.5
      BGM: { VOLUME:0.25 },
    },
    standard: {
      LOCK: { START_MS:250, STAMP_NEXT_MS:200, QR_TAP_MS:200, END_TAP_MS:250, ANSWER_PICK_MS:200, NEXT_BTN_MS:200 },
      HOLD: { CORRECT_MS:750, WRONG_MS:1000 },
      GACHA: {
        BASE_MS:900,
        RANDOM_JITTER_MS:250,
        PAUSE_RATIO:0.55,
        PAUSE_MIN_MS:200,
        PAUSE_MS:900
      },
      RATE: { BIG:0.5, NEAR_MISS:0.75 }, // ※テスト用でBIGを0.5
      BGM: { VOLUME:0.25 },
    },
    sticky: {
      LOCK: { START_MS:260, STAMP_NEXT_MS:210, QR_TAP_MS:210, END_TAP_MS:260, ANSWER_PICK_MS:210, NEXT_BTN_MS:210 },
      HOLD: { CORRECT_MS:980, WRONG_MS:1200 },
      GACHA: {
        BASE_MS:1200,
        RANDOM_JITTER_MS:420,
        PAUSE_RATIO:0.70,
        PAUSE_MIN_MS:240,
        PAUSE_MS:1100
      },
      RATE: { BIG:0.5, NEAR_MISS:0.88 }, // ※テスト用でBIGを0.5
      BGM: { VOLUME:0.25 },
    },
  };

  const FX = FX_PRESETS[FX_PRESET_KEY] || FX_PRESETS.standard;

  // ====== ガチャ画像：ポン！（共通1パターン） ======
  const GACHA_POP = {
    ENABLE: true,
    SCALE: 1.2,
    DURATION_MS: 180,
    DELAY_MS: 500,
    EASING: "cubic-bezier(.2,.9,.2,1)",
    ORIGIN: "50% 50%",
  };

  // ====== 問題 ======
  const QUESTIONS = [
    { q: "ぼくの名前はな〜んだ？", choices: ["ネッシー","しゃちー","オルシー","しらんしー"], correct:"3", image:"orc_normal.png" },
    { q: "ボコボコ…って、なにしてる音？", choices: ["あわを出してる","ねてる","うたってる","おこってる"], correct:"1", image:"q2.png" },
    { q: "くじらは何類？", choices: ["さかな","ほにゅうるい","はちゅうるい","とり"], correct:"2", image:"q3.png" },
    { q: "この子は誰？", choices: ["ウニ","タワシ","栗","まんまる石"], correct:"1", image:"q4.png" },
    { q: "この水族館のおすすめのランチは？", choices: ["カレー","ラーメン","おすし","パンケーキ"], correct:"1", image:"q5.png" },
    { q: "しゃちは何を食べる？", choices: ["さかな","チョコ","せっけん","くつした"], correct:"1", image:"q6.png" },
    { q: "海の中でよく見える色はどれ？", choices: ["あお","あか","ピンク","みどり"], correct:"1", image:"q7.png" },
    { q: "イルカはどこで息をする？", choices: ["おなか","しっぽ","あたま","ひれ"], correct:"3", image:"q8.png" },
    { q: "水族館で守るといいマナーは？", choices: ["走る","大声","さわる","静かに見る"], correct:"4", image:"q9.png" },
    { q: "オルシーの好きなものは？", choices: ["静寂","雷","ねばねば","スマホ"], correct:"1", image:"q10.png" },
  ].slice(0, QUESTIONS_PER_PLAY);

  const PRAISE = [
    "物知り博士じゃないか！",
    "すごい！キミ、えらすぎ！",
    "天才のにおいがする…！",
    "今日のキミ、強い…！",
    "知識がキラキラしてる！",
    "オルシー、びっくりした！"
  ];
  const SOFT_WRONG = [
    "おしいっ！でもナイス挑戦！",
    "ちがった〜！…でも好き！",
    "これは引っかけだったかも！",
    "ドンマイ！次で取り返そ！",
    "うんうん、そう思うよね〜！"
  ];

  // ====== BGM ======
  let bgm = null;
  function playBGM(){
    if (!bgm) {
      bgm = new Audio("bgm.mp3");
      bgm.loop = true;
      bgm.volume = FX.BGM.VOLUME;
    } else {
      bgm.volume = FX.BGM.VOLUME;
    }
    bgm.play().catch(e => console.log("BGM play failed:", e));
  }

  // ====== DOM ======
  const app = document.getElementById("app");
  const sStart = gid("s-start");
  const sStamp = gid("s-stamp");
  const sQ = gid("s-q");
  const sPause = gid("s-pause");
  const sAns = gid("s-ans");
  const sGacha = gid("s-gacha");
  const sPrize = gid("s-prize");
  const sEnd = gid("s-end");
  const sQR = gid("s-qr");

  const qTitle = sQ.querySelector(".title");
  const qText = sQ.querySelector(".question");
  const qImage = gid("q-image");
  const choicesBox = gid("choices");

  const hudStamps = gid("hud-stamps");
  const hudProgress = gid("hud-progress");

  const ansTitle = gid("ans-title");
  const ansImg = gid("ans-img");
  const ansMsg = gid("ans-msg");

  const prizeTitle = gid("prize-title");
  const prizeImg = gid("prize-img");
  const prizeMsg = gid("prize-msg");
  const nextBtn = gid("next");

  const scoreEl = gid("score");

  const stampStatus = gid("stamp-status");
  const stampSub = gid("stamp-sub");
  const stampNext = gid("stamp-next");

  const qrCanvas = gid("qr");
  const qrMsg = gid("qr-msg");
  const qrSub = gid("qr-sub");

  function gid(id){ return document.getElementById(id); }

  function show(which){
    [sStart, sStamp, sQ, sPause, sAns, sGacha, sPrize, sEnd, sQR].forEach(el => el.classList.add("hidden"));
    which.classList.remove("hidden");
  }

  // ====== ガチャ画像：ポン！（拡大） ======
  let gachaPopAnim = null;

  function getGachaImg(){
    return sGacha.querySelector(".orc img");
  }
  function resetGachaImgStyle(){
    const img = getGachaImg();
    if (!img) return;
    img.style.transform = "";
    img.style.transformOrigin = "";
    img.style.willChange = "";
  }
  function playGachaPop(){
    if (!GACHA_POP.ENABLE) return;
    const img = getGachaImg();
    if (!img) return;

    if (gachaPopAnim) { gachaPopAnim.cancel(); gachaPopAnim = null; }

    img.style.transformOrigin = GACHA_POP.ORIGIN;
    img.style.willChange = "transform";

    gachaPopAnim = img.animate(
      [
        { transform: "scale(1)" },
        { transform: `scale(${GACHA_POP.SCALE})` },
        { transform: "scale(1)" },
      ],
      {
        duration: GACHA_POP.DURATION_MS,
        iterations: 1,
        easing: GACHA_POP.EASING,
      }
    );

    gachaPopAnim.onfinish = () => {
      gachaPopAnim = null;
      resetGachaImgStyle();
    };
  }

  // ====== fit ======
  function fit(){
    const isMobile = window.matchMedia("(max-width: 600px)").matches;

    if (isMobile) {
      app.style.transform = "none";
      app.style.width = "100vw";
      app.style.height = "100svh";
    } else {
      const sc = Math.min(window.innerWidth / 390, window.innerHeight / 844);
      app.style.transform = `scale(${sc})`;
      app.style.width = "390px";
      app.style.height = "844px";
    }
  }
  window.addEventListener("resize", fit, {passive:true});
  fit();

  // ====== 永続（スタンプ） ======
  const LS_STAMPS = "orcy_stampCount";
  const LS_BONUS_DONE = "orcy_firstBonusDone";

  function loadStampCount(){
    const v = Number(localStorage.getItem(LS_STAMPS) || 0);
    return Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
  }
  function saveStampCount(v){
    localStorage.setItem(LS_STAMPS, String(v));
  }
  function loadBonusDone(){
    return localStorage.getItem(LS_BONUS_DONE) === "1";
  }
  function saveBonusDone(){
    localStorage.setItem(LS_BONUS_DONE, "1");
  }

  // ====== 状態 ======
  let current = 0;
  let correctCount = 0;
  let stampCount = loadStampCount();
  let locked = false;

  let afterStamp = null;
  let afterQR = null;

  function lock(ms){
    locked = true;
    setTimeout(() => { locked = false; }, ms);
  }
  function randFrom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function renderHUD(){
    hudStamps.textContent = `スタンプ ${stampCount}/${STAMPS_FOR_QR}`;
    hudProgress.textContent = `${current + 1}/${QUESTIONS.length}`;
  }

  function renderQuestion(){
    const data = QUESTIONS[current];
    qTitle.textContent = `第${current + 1}問`;
    qText.textContent = data.q;

    if (data.image) {
      qImage.src = data.image;
      qImage.style.display = "block";
    } else {
      qImage.style.display = "none";
    }

    choicesBox.innerHTML = "";
    data.choices.forEach((label, i) => {
      const b = document.createElement("button");
      b.className = "btn";
      b.setAttribute("data", String(i + 1));
      b.textContent = label;
      choicesBox.appendChild(b);
    });

    renderHUD();
  }

  function renderScore(){
    scoreEl.textContent = `正解数：${correctCount}（${QUESTIONS.length}問中）`;
  }

  function showStampScreen(message, nextFn){
    stampStatus.textContent = message || `いま スタンプ ${stampCount}/${STAMPS_FOR_QR}`;
    const remain = Math.max(0, STAMPS_FOR_QR - stampCount);
    stampSub.textContent = `あと${remain}こでチケット！`;
    afterStamp = nextFn;
    show(sStamp);
  }

  // ★ダミーQR生成
  function drawPseudoQR(canvas, payload){
    const ctx = canvas.getContext("2d");
    const N = 29;
    const size = canvas.width;
    const cell = Math.floor(size / N);
    const pad = Math.floor((size - cell * N) / 2);

    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,size,size);

    let h = 2166136261;
    for (let i = 0; i < payload.length; i++){
      h ^= payload.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    function rnd(){
      h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
      return (h >>> 0) / 4294967296;
    }

    function finder(x,y){
      ctx.fillStyle = "#000";
      ctx.fillRect(pad + x*cell, pad + y*cell, 7*cell, 7*cell);
      ctx.fillStyle = "#fff";
      ctx.fillRect(pad + (x+1)*cell, pad + (y+1)*cell, 5*cell, 5*cell);
      ctx.fillStyle = "#000";
      ctx.fillRect(pad + (x+2)*cell, pad + (y+2)*cell, 3*cell, 3*cell);
    }
    finder(0,0); finder(N-7,0); finder(0,N-7);

    for (let y = 0; y < N; y++){
      for (let x = 0; x < N; x++){
        const inFinder =
          (x < 7 && y < 7) ||
          (x >= N-7 && y < 7) ||
          (x < 7 && y >= N-7);
        if (inFinder) continue;
        if (rnd() < 0.42){
          ctx.fillStyle = "#000";
          ctx.fillRect(pad + x*cell, pad + y*cell, cell, cell);
        }
      }
    }

    ctx.strokeStyle = "rgba(0,0,0,.12)";
    ctx.lineWidth = 2;
    ctx.strokeRect(1,1,size-2,size-2);
  }

  function showQR(message, returnFn){
    qrMsg.textContent = message;
    qrSub.textContent = CONSUME_STAMPS_ON_QR
      ? `※スタンプを${STAMPS_FOR_QR}こ使いました（残り：${stampCount}）`
      : `※スタンプは保持（現在：${stampCount}）`;
    drawPseudoQR(qrCanvas, QR_PAYLOAD);
    afterQR = returnFn;
    show(sQR);
  }

  function goNextQuestionOrEnd(){
    if (current < QUESTIONS.length - 1) {
      current++;
      renderQuestion();
      show(sQ);
    } else {
      renderScore();
      show(sEnd);
    }
  }

  function maybeShowQRThen(nextFn){
    if (stampCount >= STAMPS_FOR_QR) {
      if (CONSUME_STAMPS_ON_QR) {
        stampCount = stampCount - STAMPS_FOR_QR;
        saveStampCount(stampCount);
      }
      showQR("スタンプが10こ たまった！\nQRを見せてね！", nextFn);
      return true;
    }
    return false;
  }

  // ====== イベント ======

  // Start：pointerdownでBGM確実に鳴らす
  sStart.addEventListener("pointerdown", () => {
    if (locked) return;
    lock(FX.LOCK.START_MS);

    playBGM();

    current = 0;
    correctCount = 0;

    if (!loadBonusDone()) {
      stampCount = loadStampCount() + FIRST_BONUS_STAMPS;
      saveStampCount(stampCount);
      saveBonusDone();
    } else {
      stampCount = loadStampCount();
    }

    renderQuestion();
    showStampScreen(`いま スタンプ ${stampCount}/${STAMPS_FOR_QR}`, () => {
      renderHUD();
      show(sQ);
    });
  });

  // スタンプ画面の「つぎ！」
  stampNext.addEventListener("click", () => {
    if (locked) return;
    lock(FX.LOCK.STAMP_NEXT_MS);
    if (typeof afterStamp === "function") afterStamp();
  });

  // QR画面タップで戻る
  sQR.addEventListener("click", () => {
    if (locked) return;
    lock(FX.LOCK.QR_TAP_MS);
    if (typeof afterQR === "function") afterQR();
  });

  // ENDタップでSTARTに戻す（仮）
  sEnd.addEventListener("click", () => {
    if (locked) return;
    lock(FX.LOCK.END_TAP_MS);
    show(sStart);
  });

  // 回答クリック
  choicesBox.addEventListener("click", (e) => {
    if (locked) return;
    const btn = e.target.closest(".btn");
    if(!btn) return;
    lock(FX.LOCK.ANSWER_PICK_MS);

    const picked = btn.getAttribute("data");
    const data = QUESTIONS[current];
    const isCorrect = (picked === data.correct);

    // 不正解は今まで通り（ガチャなし）
    if (!isCorrect) {
      show(sAns);
      ansTitle.textContent = "ざんねん…";
      ansImg.src = "orc_lose.png";
      ansMsg.textContent = randFrom(SOFT_WRONG);

      setTimeout(() => {
        locked = false;
        goNextQuestionOrEnd();
      }, FX.HOLD.WRONG_MS);
      return;
    }

    // ===== 正解：まず「正解表示」→ガチャ→ぽこぽこ→結果 =====
    correctCount++;

    show(sAns);
    ansTitle.textContent = "正解！";
    ansImg.src = "orc_win.png";
    ansMsg.textContent = randFrom(PRAISE);

    setTimeout(() => {
      // ガチャ画面へ（画像だけ）
      show(sGacha);

      // ★共通：ガチャ画像を一瞬ポン！
      setTimeout(() => playGachaPop(), GACHA_POP.DELAY_MS);

      // 結果を先に決める（※演出は今回は付けない）
      const big = (Math.random() < FX.RATE.BIG);
      const nearMiss = (!big && Math.random() < FX.RATE.NEAR_MISS);

      // ★ガチャ時間は共通（nearMissで伸ばさない）
      const totalWait =
        FX.GACHA.BASE_MS +
        Math.floor(Math.random() * FX.GACHA.RANDOM_JITTER_MS);

      const pauseAt = Math.max(
        FX.GACHA.PAUSE_MIN_MS,
        Math.floor(totalWait * FX.GACHA.PAUSE_RATIO)
      );

      setTimeout(() => {
        show(sPause);
      }, pauseAt);

      // ぽこぽこが終わったら結果へ
      setTimeout(() => {
        show(sPrize);
        locked = false;

        let gotStamp = false;

        if (big) {
          stampCount = loadStampCount() + 1;
          saveStampCount(stampCount);
          gotStamp = true;

          prizeTitle.textContent = "大当たり！";
          prizeImg.src = "bingo.png";
          prizeMsg.textContent = "スタンプ 1こゲット！！\nいいぞいいぞ〜！";
        } else {
          prizeTitle.textContent = "ざんねん！";
          prizeImg.src = "bonus.png";
          // いったん nearMiss / 通常はずれ どちらも「ドンマイカード」寄せにする
          prizeMsg.textContent = "ドンマイカードをゲット！";
        }

        renderHUD();

        nextBtn.onclick = () => {
          if (locked) return;
          lock(FX.LOCK.NEXT_BTN_MS);

          if (gotStamp) {
            showStampScreen(`スタンプ ${stampCount}/${STAMPS_FOR_QR}\n（+1！）`, () => {
              if (maybeShowQRThen(() => goNextQuestionOrEnd())) return;
              goNextQuestionOrEnd();
            });
            return;
          }

          if (maybeShowQRThen(() => goNextQuestionOrEnd())) return;
          goNextQuestionOrEnd();
        };

      }, pauseAt + FX.GACHA.PAUSE_MS);

    }, FX.HOLD.CORRECT_MS);
  });

  // 初期表示
  show(sStart);

  // ====== util ======
  function gid(id){ return document.getElementById(id); }
})();
</script>
